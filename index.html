<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dars jadvali</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dars jadvali">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mu:#6b7280;--ac:#4f46e5;--ac2:#eef0ff;--bd:#e5e7eb;--dg:#dc2626;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1117;--card:#181b24;--tx:#e8eaf0;--mu:#9aa1b2;--ac:#818cf8;--ac2:#232850;--bd:#2a2e3b;--dg:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1117;--card:#181b24;--tx:#e8eaf0;--mu:#9aa1b2;--ac:#818cf8;--ac2:#232850;--bd:#2a2e3b;--dg:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:84px}
#app{max-width:640px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.c{text-align:center;display:flex;flex-direction:column}
.c small,.mu{color:var(--mu)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin:10px 0}
.card.dn{opacity:.6}.card.dn b{text-decoration:line-through}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tm{background:var(--ac2);color:var(--ac);border-radius:8px;padding:2px 8px;font-weight:600;font-size:14px}
.rm{margin-left:auto;color:var(--mu);font-size:14px}
textarea,input,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:9px;margin-top:8px}
textarea{resize:vertical}
button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px}
button.pri{background:var(--ac);border-color:var(--ac);color:#fff;margin-top:10px}
button.dg{color:var(--dg)}
.ic{font-size:22px;line-height:1;padding:6px 14px}
.pill{display:block;margin:0 auto 6px;border-radius:99px;color:var(--ac);background:var(--ac2);border-color:transparent}
.seg,.chips{display:flex;gap:6px;margin:8px 0}
.seg button,.chips button{flex:1}
.seg .on,.chips .on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chk{display:flex;gap:10px;align-items:flex-start;margin-top:8px}
.chk input{width:20px;height:20px;margin:2px 0 0}
.btns{display:flex;gap:8px;margin-top:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:14px;color:var(--mu)}
.row2{display:flex;gap:8px;align-items:center}.row2 button{margin-top:8px}
.cl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.wx{text-align:center;color:var(--mu);margin:2px 0 10px;font-size:15px}
.hrs{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 6px;position:relative;text-align:center;-webkit-overflow-scrolling:touch}.hr{flex:0 0 auto;min-width:58px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14px;color:var(--tx)}.hr small{color:var(--mu);font-size:12px;min-height:15px}.hr span{font-size:20px;line-height:1.3}.hr.now{border-color:var(--ac);background:var(--ac2)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;font-size:12px;padding:8px 2px;color:var(--mu)}
nav button span{display:block;font-size:20px}
nav button.on{color:var(--ac);font-weight:600}
</style>
</head>
<body>
<div id="app"></div>
<nav>
<button data-t="today"><span>📅</span>Bugun</button>
<button data-t="sched"><span>🗓️</span>Jadval</button>
<button data-t="hw"><span>✅</span>Vazifa</button>
<button data-t="notes"><span>📝</span>Zametka</button>
<button data-t="set"><span>⚙️</span>Sozlama</button>
</nav>
<script>
const $=s=>document.querySelector(s);
const DN=['Yakshanba','Dushanba','Seshanba','Chorshanba','Payshanba','Juma','Shanba'];
const DS=['Ya','Du','Se','Ch','Pa','Ju','Sh'];
const ORDER=[1,2,3,4,5,6,0];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const parse=s=>{const[a,b,c]=s.split('-').map(Number);return new Date(a,b-1,c)};
const monday=d=>{const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x};
const fmt=s=>{const d=parse(s);return DS[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)};
const other=p=>p==='juft'?'toq':'juft';
let S,tab='today',vd=iso(new Date()),sp='juft',sd=1,eid=null,ne=null,np=0;

function load(){
  try{S=JSON.parse(localStorage.getItem('dj')||'null')}catch(e){S=null}
  if(!S||!S.sched)S={anchor:{mon:iso(monday(new Date())),p:'toq'},sched:{juft:{},toq:{}},hw:{},notes:[],theme:'auto'};
}
const CITIES={'Toshkent':[41.2995,69.2401],'Samarqand':[39.6542,66.9597],'Buxoro':[39.7747,64.4286],'Andijon':[40.7821,72.3442],'Namangan':[40.9983,71.6726],'Farg’ona':[40.3864,71.7864],'Nukus':[42.4531,59.6103],'Qarshi':[38.8606,65.7891],'Termiz':[37.2242,67.2783],'Urganch':[41.55,60.6333],'Navoiy':[40.0844,65.3792],'Jizzax':[40.1158,67.8422],'Guliston':[40.4897,68.7842]};
const wxIcon=(c,hr)=>(c<=1&&hr!==undefined&&(hr<6||hr>=20))?'🌙':c===0?'☀️':c<=2?'⛅':c===3?'☁️':c<=48?'🌫️':c<=57?'🌦️':c<=67?'🌧️':c<=77?'❄️':c<=82?'🌦️':c<=86?'🌨️':'⛈️';
function wxBox(){
  const w=S.wx,d=w&&w.d;if(!d)return '';
  const i=d.time.indexOf(vd);if(i<0)return '';
  const r=d.precipitation_probability_max[i],H=w.h;
  const now=new Date(),isToday=vd===iso(now),ck=iso(now)+'T'+String(now.getHours()).padStart(2,'0')+':00';
  const ci=(H&&isToday)?H.time.indexOf(ck):-1;
  const mm=`${Math.round(d.temperature_2m_max[i])}° / ${Math.round(d.temperature_2m_min[i])}°`;
  let top=ci>=0
    ?`${wxIcon(H.weather_code[ci],now.getHours())} <b>${Math.round(H.temperature_2m[ci])}°</b> hozir · ${mm}`
    :`${wxIcon(d.weather_code[i])} <b>${Math.round(d.temperature_2m_max[i])}°</b> / ${Math.round(d.temperature_2m_min[i])}°`;
  top+=` · ${esc(w.c)}${r>=30?' · 💧'+r+'%':''}`;
  let strip='';
  if(H){
    const items=[];
    H.time.forEach((t,k)=>{
      if(t.slice(0,10)!==vd)return;
      const hr=+t.slice(11,13),p=H.precipitation_probability[k];
      items.push(`<div class="hr${t===ck?' now':''}"><small>${t.slice(11,16)}</small><span>${wxIcon(H.weather_code[k],hr)}</span><b>${Math.round(H.temperature_2m[k])}°</b><small>${p>=30?'💧'+p+'%':''}</small></div>`);
    });
    if(items.length)strip=`<div class="hrs">${items.join('')}</div>`;
  }
  return top+strip;
}
function wxScroll(){const el=document.querySelector('.hrs .now');if(el)el.parentNode.scrollLeft=Math.max(0,el.offsetLeft-8)}
async function wxLoad(force){
  const w=S.wx;if(!force&&w.d&&w.h&&Date.now()-w.ts<18e5)return;
  try{
    const r=await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&hourly=temperature_2m,weather_code,precipitation_probability&timezone=auto&forecast_days=7`);
    const j=await r.json();
    if(j&&j.daily){w.d=j.daily;w.h=j.hourly;w.ts=Date.now();save();const el=$('#wx');if(el){el.innerHTML=wxBox();wxScroll()}}
  }catch(e){}
}
function fixS(){if(!S.wx)S.wx={c:'Toshkent',lat:41.2995,lon:69.2401};if(!S.slots)S.slots=[{s:'08:30',e:'09:50'},{s:'10:00',e:'11:20'},{s:'11:30',e:'12:50'},{s:'13:30',e:'14:50'}]}
function save(){try{localStorage.setItem('dj',JSON.stringify(S))}catch(e){}}
function theme(){document.documentElement.dataset.theme=S.theme==='auto'?'':S.theme}
function parity(d){
  const w=Math.round((monday(d)-parse(S.anchor.mon))/6048e5);
  return (((w%2)+2)%2===0)?S.anchor.p:other(S.anchor.p);
}
const lessons=(p,d)=>((S.sched[p]||{})[d]||[]).slice().sort((a,b)=>a.s.localeCompare(b.s));
const lessonRow=l=>`<div class="row"><span class="tm">${esc(l.s)}–${esc(l.e)}</span><b>${esc(l.n)}</b>${l.r?`<span class="rm">${esc(l.r)}</span>`:''}</div>`;

function vToday(){
  const d=parse(vd),p=parity(d),ls=lessons(p,d.getDay());
  let h=`<div class="top"><button class="ic" data-a="prev">‹</button><div class="c"><b>${DN[d.getDay()]}</b><small>${d.getDate()}.${d.getMonth()+1}.${d.getFullYear()}</small></div><button class="ic" data-a="next">›</button></div>
<button class="pill" data-a="flip">${p==='juft'?'Juft':'Toq'} hafta ⇄</button>
<div id="wx" class="wx">${wxBox()}</div>`;
  if(!ls.length)h+='<p class="mu" style="text-align:center">Bu kunda dars yo’q 🎉</p>';
  ls.forEach(l=>{
    const k=vd+'|'+l.id,x=S.hw[k]||{};
    h+=`<div class="card">${lessonRow(l)}
<textarea data-k="${k}" data-n="${esc(l.n)}" rows="2" placeholder="Uyga vazifa…">${esc(x.t||'')}</textarea>
<label class="chk"><input type="checkbox" data-c="${k}" data-n="${esc(l.n)}" ${x.d?'checked':''}> Bajarildi</label></div>`;
  });
  return h;
}
function vSched(){
  const L=lessons(sp,sd);
  let h=`<div class="seg"><button data-a="sp" data-v="juft" class="${sp==='juft'?'on':''}">Juft hafta</button><button data-a="sp" data-v="toq" class="${sp==='toq'?'on':''}">Toq hafta</button></div>
<div class="chips">${ORDER.map(i=>`<button data-a="sd" data-v="${i}" class="${i===sd?'on':''}">${DS[i]}</button>`).join('')}</div>`;
  if(!L.length)h+='<p class="mu">Bu kunga dars qo’shilmagan</p>';
  L.forEach(l=>h+=`<div class="card">${lessonRow(l)}<div class="btns"><button data-a="ed" data-v="${l.id}">Tahrirlash</button><button class="dg" data-a="del" data-v="${l.id}">O’chirish</button></div></div>`);
  const e=L.find(l=>l.id===eid)||{};
  const sl=S.slots,d0=sl[np]||sl[0]||{s:'08:30',e:'09:50'},cs=e.s||d0.s,ce=e.e||d0.e,si=sl.findIndex(x=>x.s===cs&&x.e===ce);
  h+=`<div class="card"><b>${e.id?'Darsni tahrirlash':'Dars qo’shish'} (${DN[sd]}, ${sp==='juft'?'juft':'toq'})</b>
<input id="fn" placeholder="Fan nomi" value="${esc(e.n||'')}">
<select id="fp">${sl.map((x,i)=>`<option value="${i}" ${i===si?'selected':''}>${i+1}-para (${x.s}–${x.e})</option>`).join('')}<option value="-1" ${si<0?'selected':''}>Boshqa vaqt</option></select>
<div class="two"><label>Boshlanishi<input id="fs" type="time" value="${cs}"></label><label>Tugashi<input id="fe" type="time" value="${ce}"></label></div>
<input id="fr" placeholder="Xona (masalan, 204)" value="${esc(e.r||'')}">
<button class="pri" data-a="saveL">Saqlash</button>${e.id?' <button data-a="cancelL">Bekor</button>':''}</div>`;
  return h;
}
function vHw(){
  const all=Object.entries(S.hw).filter(([k,x])=>x.t&&x.t.trim()).map(([k,x])=>({k,...x}));
  const p=all.filter(x=>!x.d).sort((a,b)=>a.dt.localeCompare(b.dt));
  const dn=all.filter(x=>x.d).sort((a,b)=>b.dt.localeCompare(a.dt)).slice(0,15);
  const it=x=>`<div class="card ${x.d?'dn':''}"><label class="chk"><input type="checkbox" data-c="${x.k}" data-n="${esc(x.n||'')}" ${x.d?'checked':''}><span><b>${esc(x.n||'')}</b> <small class="mu">${fmt(x.dt)}</small><br>${esc(x.t)}</span></label></div>`;
  let h='<h3>Bajarilmagan</h3>'+(p.length?p.map(it).join(''):'<p class="mu">Hammasi bajarilgan 🎉</p>');
  if(dn.length)h+='<h3>Bajarilgan</h3>'+dn.map(it).join('');
  return h;
}
function vNotes(){
  if(ne!==null){
    const n=S.notes.find(x=>x.id===ne)||{};
    return `<div class="card"><input id="nt" placeholder="Sarlavha" value="${esc(n.t||'')}"><textarea id="nx" rows="12" placeholder="Matn…">${esc(n.x||'')}</textarea>
<div class="btns"><button class="pri" data-a="saveN">Saqlash</button><button data-a="cancelN" style="margin-top:10px">Bekor</button>${n.id?'<button class="dg" data-a="delN" style="margin-top:10px">O’chirish</button>':''}</div></div>`;
  }
  return `<div class="row2"><input id="q" placeholder="Qidirish…"><button class="pri" data-a="newN">＋</button></div><div id="nl"></div>`;
}
function noteList(){
  const el=$('#nl');if(!el)return;
  const q=(($('#q')||{}).value||'').toLowerCase();
  const L=S.notes.filter(n=>((n.t||'')+' '+(n.x||'')).toLowerCase().includes(q)).sort((a,b)=>b.ts-a.ts);
  el.innerHTML=L.length?L.map(n=>`<div class="card" data-a="openN" data-v="${n.id}"><b>${esc(n.t||'Nomsiz')}</b><div class="mu cl">${esc(n.x)}</div></div>`).join(''):'<p class="mu">Zametka yo’q</p>';
}
function vSet(){
  const T={auto:'Avto',light:'Yorug’',dark:'Qorong’u'}[S.theme];
  return `<div class="card"><b>Ko’rinish</b><br><button class="pri" data-a="theme">Mavzu: ${T}</button></div>
<div class="card"><b>Hafta turi</b><p class="mu">Hozirgi hafta: ${parity(new Date())==='juft'?'juft':'toq'}. Noto’g’ri bo’lsa, almashtiring.</p><button data-a="flipNow">Juft ⇄ Toq</button></div>
<div class="card"><b>Ob-havo</b><p class="mu">Internet bo’lganda yangilanadi, aks holda oxirgi saqlangan ma’lumot ko’rinadi.</p><select data-wc="1">${Object.keys(CITIES).map(c=>`<option ${c===S.wx.c?'selected':''}>${c}</option>`).join('')}${CITIES[S.wx.c]?'':`<option selected>${esc(S.wx.c)}</option>`}</select><button data-a="geo" style="margin-top:8px">📍 Joylashuvim bo’yicha</button></div>
<div class="card"><b>Para vaqtlari</b><p class="mu">Bir marta kiriting. Dars qo’shganda parani tanlaysiz, vaqt o’zi to’ladi.</p>${S.slots.map((x,i)=>`<div class="row2"><span class="mu">${i+1}</span><input type="time" data-sl="${i}" data-f="s" value="${x.s}"><input type="time" data-sl="${i}" data-f="e" value="${x.e}"><button class="dg" data-a="delSl" data-v="${i}">✕</button></div>`).join('')}<button data-a="addSl" style="margin-top:10px">＋ Para qo’shish</button></div>
<div class="card"><b>Zaxira</b><p class="mu">“Nusxa olish” bosib, matnni xavfsiz joyga (masalan, Saqlangan xabarlar) saqlang. Tiklash uchun matnni shu yerga qo’yib “Tiklash” bosing.</p><textarea id="bk" rows="4"></textarea><div class="btns"><button data-a="exp">Nusxa olish</button><button data-a="imp">Tiklash</button></div></div>`;
}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  $('#app').innerHTML=({today:vToday,sched:vSched,hw:vHw,notes:vNotes,set:vSet})[tab]();
  if(tab==='notes')noteList();
  if(tab==='today'){wxScroll();wxLoad()}
}
function shift(n){const d=parse(vd);d.setDate(d.getDate()+n);vd=iso(d)}

document.addEventListener('click',e=>{
  const t=e.target.closest('nav button[data-t]');
  if(t){tab=t.dataset.t;ne=null;eid=null;render();return}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,v=b.dataset.v;
  if(a==='prev')shift(-1);
  else if(a==='next')shift(1);
  else if(a==='flip'){const d=parse(vd);S.anchor={mon:iso(monday(d)),p:other(parity(d))};save()}
  else if(a==='sp'){sp=v;eid=null;np=0}
  else if(a==='sd'){sd=+v;eid=null;np=0}
  else if(a==='ed')eid=v;
  else if(a==='cancelL')eid=null;
  else if(a==='del'){S.sched[sp][sd]=lessons(sp,sd).filter(l=>l.id!==v);eid=null;save()}
  else if(a==='saveL'){
    const n=$('#fn').value.trim();if(!n){$('#fn').focus();return}
    const o={n,s:$('#fs').value||'08:30',e:$('#fe').value||'09:50',r:$('#fr').value.trim()};
    const arr=S.sched[sp][sd]||(S.sched[sp][sd]=[]);
    const ex=arr.find(l=>l.id===eid);
    if(ex)Object.assign(ex,o);else{arr.push({id:uid(),...o});const pi=+$('#fp').value;if(pi>=0)np=Math.min(pi+1,S.slots.length-1)}
    eid=null;save();
  }
  else if(a==='geo'){if(navigator.geolocation)navigator.geolocation.getCurrentPosition(q=>{S.wx={c:'Joylashuv',lat:q.coords.latitude,lon:q.coords.longitude};save();wxLoad(true).then(()=>render())},()=>{});return}
  else if(a==='delSl'){S.slots.splice(+v,1);save()}
  else if(a==='addSl'){S.slots.push({s:'08:30',e:'09:50'});save()}
  else if(a==='newN')ne='new';
  else if(a==='openN')ne=v;
  else if(a==='cancelN')ne=null;
  else if(a==='delN'){S.notes=S.notes.filter(n=>n.id!==ne);ne=null;save()}
  else if(a==='saveN'){
    const o={t:$('#nt').value.trim(),x:$('#nx').value,ts:Date.now()};
    if(!o.t&&!o.x.trim()){ne=null;render();return}
    const ex=S.notes.find(n=>n.id===ne);
    if(ex)Object.assign(ex,o);else S.notes.push({id:uid(),...o});
    ne=null;save();
  }
  else if(a==='theme'){S.theme={auto:'light',light:'dark',dark:'auto'}[S.theme];save();theme()}
  else if(a==='flipNow'){S.anchor={mon:iso(monday(new Date())),p:other(parity(new Date()))};save()}
  else if(a==='exp'){
    const el=$('#bk');el.value=JSON.stringify(S);el.select();
    try{navigator.clipboard.writeText(el.value)}catch(err){}
    return;
  }
  else if(a==='imp'){
    try{const o=JSON.parse($('#bk').value);if(!o.sched||!o.anchor)throw 0;S=o;fixS();save();theme();tab='today'}
    catch(err){$('#bk').value='';$('#bk').placeholder='Matn noto’g’ri. Qayta urinib ko’ring.';return}
  }
  render();
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.k){
    const x=S.hw[t.dataset.k]||(S.hw[t.dataset.k]={d:false});
    x.t=t.value;x.n=t.dataset.n;x.dt=t.dataset.k.split('|')[0];save();
  }
  if(t.id==='q')noteList();
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.wc&&CITIES[t.value]){S.wx={c:t.value,lat:CITIES[t.value][0],lon:CITIES[t.value][1]};save();wxLoad(true)}
  if(t.id==='fp'){const x=S.slots[+t.value];if(x){$('#fs').value=x.s;$('#fe').value=x.e}}
  if(t.dataset.sl!==undefined){S.slots[+t.dataset.sl][t.dataset.f]=t.value;save()}
  if(t.dataset.c){
    const k=t.dataset.c,x=S.hw[k]||(S.hw[k]={t:'',d:false});
    x.d=t.checked;x.n=x.n||t.dataset.n;x.dt=k.split('|')[0];save();
    if(tab==='hw')render();
  }
});
load();fixS();theme();
